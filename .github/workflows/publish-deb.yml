name: publish-deb

# Builds codetracer-solana-recorder as a .deb package, signs it with
# the CodeTracer GPG key, and uploads it to deb.codetracer.com
# (Cloudflare R2 bucket).
#
# Uses the org-level deb-bucket secrets configured on
# metacraft-labs (accessible to every org repo). There is one
# CodeTracer-wide R2 bucket for deb hosting and these secrets
# point at it.
#
# Required secrets (org-level on metacraft-labs):
#   CODETRACER_DEB_BUCKET_ACCESS_KEY_ID
#   CODETRACER_DEB_BUCKET_ACCESS_KEY
#   CODETRACER_DEB_BUCKET_S3_URL
#   CODETRACER_DEB_BUCKET_TOKEN           (R2/S3 token, if needed)
#   CODETRACER_AUR_GPG_PRIVATE_KEY        (re-used: same GPG key)
#   CODETRACER_AUR_GPG_PRIVATE_KEY_PASS
#   CI_TOKEN_PROVIDER_APP_ID / CI_TOKEN_PROVIDER_PRIVATE_KEY
#                                         (sibling clones in setup-dev-env)
# Required variables:
#   R2_CODETRACER_BUCKET_NAME
#
# Runs on the self-hosted NixOS runners: every tool comes from Nix (the
# repo's dev shell for the build, the flake-pinned nixpkgs for dpkg-deb,
# patchelf, gnupg and the AWS CLI). Each architecture is built natively on
# a runner of that architecture, so no cross toolchain is needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Recorder semver to publish'
        required: true
        default: '0.1.0'
      arch:
        description: 'Target architecture (amd64 / arm64)'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64
      dry_run:
        description: 'Build the .deb but skip the upload'
        required: false
        type: boolean
        default: false

jobs:
  build-and-publish-deb:
    runs-on: [self-hosted, linux, "${{ (inputs.arch || 'amd64') == 'arm64' && 'arm64' || 'x64' }}"]
    name: deb / ${{ inputs.arch || 'amd64' }}
    environment: deb
    env:
      ARCH: ${{ inputs.arch || 'amd64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The `inputs` context is populated only for workflow_dispatch. On a
          # `push: tags` run it is empty, so take the version from the tag
          # instead, and fail loudly rather than publishing an empty version.
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${INPUT_VERSION}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::Cannot resolve a version: this run is neither a refs/tags/v* push nor a workflow_dispatch supplying inputs.version." >&2
            exit 1
          fi
          echo "Resolved version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # Installs Nix and clones the siblings listed in .github/sibling-repos
        # at the revisions this commit's repro.lock pins.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Build recorder binary
        run: |
          set -euo pipefail
          dev-exec cargo build --release --locked \
            --bin codetracer-solana-recorder
          binary="$(pwd)/target/release/codetracer-solana-recorder"
          # The Nix toolchain links the binary against the Nix store's
          # dynamic loader. Point it at the standard FHS loader and drop the
          # store RUNPATH so it runs on the distributions that install
          # the package, then refuse to ship anything still tied to /nix.
          case "$(uname -m)" in
            x86_64)  loader=/lib64/ld-linux-x86-64.so.2 ;;
            aarch64) loader=/lib/ld-linux-aarch64.so.1 ;;
            *) echo "::error::unsupported build machine $(uname -m)"; exit 1 ;;
          esac
          nix shell --inputs-from . nixpkgs#patchelf nixpkgs#binutils -c bash -euo pipefail -c '
            patchelf --set-interpreter "$1" --remove-rpath "$2"
            readelf -lW "$2" | grep "program interpreter"
            readelf -dW "$2" | grep -E "NEEDED|RPATH|RUNPATH" || true
            if readelf -lW -dW "$2" | grep -q /nix/store; then
              echo "::error::$2 still references /nix/store"; exit 1
            fi
            floor=$(objdump -T "$2" | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -n1)
            echo "::notice::$(basename "$2") requires glibc ${floor#GLIBC_} or newer"
            echo "glibc_floor=${floor#GLIBC_}" >> "$GITHUB_ENV"
          ' _ "$loader" "$binary"
          echo "binary=$binary" >> "$GITHUB_ENV"

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The generated control file carries the template's version and
          # architecture; stamp the ones being released, and the glibc the
          # binary was linked against, so apt refuses an older libc6 instead
          # of installing a binary that cannot start.
          sed -i -e "s/^Version: .*/Version: ${VERSION}/" \
            -e "s/^Architecture: .*/Architecture: ${ARCH}/" \
            -e "/^Depends:/s/\blibc6\b/libc6 (>= ${glibc_floor})/" packaging/deb/control
          mkdir -p out
          nix shell --inputs-from . nixpkgs#dpkg -c \
            bash packaging/deb/build.sh \
            packaging/deb \
            "${{ env.binary }}" \
            out \
            codetracer-solana-recorder \
            "$VERSION" \
            codetracer-solana-recorder \
            "$ARCH"
          nix shell --inputs-from . nixpkgs#dpkg -c \
            dpkg-deb --info "out/codetracer-solana-recorder_${VERSION}_${ARCH}.deb"

      - name: Sign .deb
        if: ${{ inputs.dry_run == false }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GPG_PRIVATE_KEY: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
        run: |
          set -euo pipefail
          deb="out/codetracer-solana-recorder_${VERSION}_${ARCH}.deb"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          # The key secret is either an armored key or its base64 encoding.
          nix shell --inputs-from . nixpkgs#gnupg -c bash -euo pipefail -c '
            if printf "%s" "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY"; then
              printf "%s\n" "$GPG_PRIVATE_KEY"
            else
              printf "%s" "$GPG_PRIVATE_KEY" | base64 -d
            fi | gpg --batch --import
            printf "%s" "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$1"
          ' _ "$deb"

      - name: Upload .deb to deb.codetracer.com (R2)
        if: ${{ inputs.dry_run == false }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CODETRACER_DEB_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CODETRACER_DEB_BUCKET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.CODETRACER_DEB_BUCKET_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::error::CODETRACER_DEB_BUCKET_ACCESS_KEY_ID secret missing; cannot upload."
            exit 1
          fi
          deb="out/codetracer-solana-recorder_${VERSION}_${ARCH}.deb"
          asc="$deb.asc"
          bucket_name="${{ vars.R2_CODETRACER_BUCKET_NAME }}"
          endpoint="${{ secrets.CODETRACER_DEB_BUCKET_S3_URL }}"
          # Path under the deb.codetracer.com namespace.
          dest="s3://$bucket_name/deb/codetracer-solana-recorder/$(basename "$deb")"
          nix shell --inputs-from . nixpkgs#awscli2 -c \
            aws --endpoint-url="$endpoint" \
            s3 cp "$deb" "$dest" --checksum-algorithm CRC32
          nix shell --inputs-from . nixpkgs#awscli2 -c \
            aws --endpoint-url="$endpoint" \
            s3 cp "$asc" "$dest.asc" --checksum-algorithm CRC32
          echo "Published $dest"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codetracer-solana-recorder-${{ steps.version.outputs.version }}-${{ env.ARCH }}.deb
          path: out/*.deb
          if-no-files-found: error
