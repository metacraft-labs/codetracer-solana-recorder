# Cross-Repo Integration Tests
#
# Validates that changes to this recorder do not break the CodeTracer VS Code
# extension's Solana DAP and GUI tests.
#
# Workspace layout (sibling repos cloned alongside this checkout):
#   $GITHUB_WORKSPACE/../
#     codetracer-solana-recorder/                      <-- this repo (checked out)
#     codetracer/                    <-- cloned (for ct binary)
#     codetracer-vscode-extension/   <-- cloned (test harness + fixtures)

name: Cross-Repo Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      codetracer_ref:
        description: 'Git ref for codetracer repo'
        required: false
        default: ''
      vscode_extension_ref:
        description: 'Git ref for codetracer-vscode-extension repo'
        required: false
        default: ''

  repository_dispatch:
    types: [cross-repo-test]

# Nix needs access-tokens to fetch private flake inputs (e.g. mcl-blockchain).
# NIX_CONFIG is set globally so both direnv and direct nix develop pick it up.
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
    accept-flake-config = true

jobs:
  wdio-integration:
    runs-on: [self-hosted, nixos]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: metacraft-labs/metacraft-github-actions/setup-nix@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-cache: ''
          trusted-public-keys: ''
          substituters: ''
          gh-token: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}

      - name: Install just
        uses: extractions/setup-just@v2

      # Resolve sibling refs using priority cascade:
      #   1. workflow_dispatch input (manual override)
      #   2. repository_dispatch payload (bidirectional trigger)
      #   3. .github/sibling-pins (pinned SHAs)
      #   4. Fallback to main
      - name: Resolve sibling refs
        id: resolve-refs
        run: |
          resolve_ref() {
            local name="$1" dispatch_input="$2" payload_field="$3"

            if [ -n "$dispatch_input" ]; then
              echo "$dispatch_input"; return
            fi
            if [ -n "$payload_field" ]; then
              echo "$payload_field"; return
            fi
            if [ -f .github/sibling-pins ]; then
              local ref
              ref="$(grep "^${name} " .github/sibling-pins | cut -d' ' -f2)" || true
              if [ -n "$ref" ]; then
                echo "$ref"; return
              fi
            fi
            echo "main"
          }

          CT_REF=$(resolve_ref codetracer \
            "${{ github.event.inputs.codetracer_ref }}" \
            "${{ github.event.client_payload.codetracer_ref }}")
          EXT_REF=$(resolve_ref codetracer-vscode-extension \
            "${{ github.event.inputs.vscode_extension_ref }}" \
            "${{ github.event.client_payload.vscode_extension_ref }}")

          resolve_branch() {
            local name="$1"
            if [ -f .github/sibling-pins ]; then
              local branch
              branch="$(grep "^${name} " .github/sibling-pins | cut -d' ' -f3)" || true
              if [ -n "$branch" ]; then
                echo "$branch"; return
              fi
            fi
            echo "main"
          }

          echo "codetracer_ref=$CT_REF" >> "$GITHUB_OUTPUT"
          echo "vscode_extension_ref=$EXT_REF" >> "$GITHUB_OUTPUT"
          EXT_BRANCH=$(resolve_branch codetracer-vscode-extension)
          echo "vscode_extension_branch=$EXT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved refs: codetracer=$CT_REF, vscode-extension=$EXT_REF (branch=$EXT_BRANCH)"

      - name: Clone codetracer
        env:
          GH_TOKEN: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          CT_REF="${{ steps.resolve-refs.outputs.codetracer_ref }}"
          DEST="$GITHUB_WORKSPACE/../codetracer"
          rm -rf "$DEST"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/codetracer.git" \
            "$DEST"
          if [ "$CT_REF" != "main" ]; then
            git -C "$DEST" fetch origin "$CT_REF"
            git -C "$DEST" checkout "$CT_REF"
          fi

      - name: Clone codetracer-vscode-extension
        env:
          GH_TOKEN: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          EXT_REF="${{ steps.resolve-refs.outputs.vscode_extension_ref }}"
          EXT_BRANCH="${{ steps.resolve-refs.outputs.vscode_extension_branch }}"
          DEST="$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git -C "$DEST" init
          git -C "$DEST" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/codetracer-vscode-extension.git"
          git -C "$DEST" fetch origin "$EXT_BRANCH"
          git -C "$DEST" checkout -b "$EXT_BRANCH" FETCH_HEAD
          if [ "$EXT_REF" != "$EXT_BRANCH" ] && [ "$EXT_REF" != "main" ]; then
            git -C "$DEST" checkout "$EXT_REF"
          fi

      - name: Clone nix-blockchain-development
        env:
          GH_TOKEN: ${{ secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          DEST="$GITHUB_WORKSPACE/../nix-blockchain-development"
          rm -rf "$DEST"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/nix-blockchain-development.git" \
            "$DEST"

      - name: Build codetracer
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer"
          nix build -L '.?submodules=1#codetracer' \
            --override-input codetracer-trace-format path:./libs/codetracer-trace-format

      - name: Install extension dependencies
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just install

      - name: Compile extension TypeScript
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      - name: Patch recorder_exec for local flake override
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          MCL_PATH="$GITHUB_WORKSPACE/../nix-blockchain-development"
          # Replace recorder_exec to bypass direnv (which can't propagate
          # GitHub auth to the NixOS Nix daemon) and use --override-input
          # to resolve mcl-blockchain from the local clone.
          cat > scripts/recorder-shell-exec.sh << HEREDOC
          #!/usr/bin/env bash
          recorder_exec() {
            local repo_dir="\$1"
            shift
            if [ -f "\$repo_dir/flake.nix" ] && command -v nix >/dev/null 2>&1; then
              nix develop "\$repo_dir" --accept-flake-config \\
                --override-input mcl-blockchain "path:$MCL_PATH" \\
                -c "\$@"
            else
              "\$@"
            fi
          }
          HEREDOC

      - name: Record Solana trace fixture
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          FORCE=1 bash scripts/prepare-solana-fixture.sh

      - name: Run Solana smoke tests
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/smoke/solana.e2e.ts"

      - name: Run Solana deep tests
        run: |
          cd "$GITHUB_WORKSPACE/../codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/deep/solana-deep.e2e.ts"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          EXT_DIAG="$GITHUB_WORKSPACE/../codetracer-vscode-extension/test/wdio/diagnostics"
          if [ -d "$EXT_DIAG" ]; then
            mkdir -p "$GITHUB_WORKSPACE/wdio-diagnostics"
            cp -r "$EXT_DIAG"/* "$GITHUB_WORKSPACE/wdio-diagnostics/"
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-solana-diagnostics
          path: wdio-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
