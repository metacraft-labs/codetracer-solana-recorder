name: publish-chocolatey

# Builds the codetracer-solana-recorder Chocolatey package (.nupkg)
# with a fresh sha256 pulled from the GitHub release, then pushes
# it to the Chocolatey Community Repository via `choco push`.
#
# This is the M11 per-recorder analogue of the launcher's
# publish-chocolatey.yml.
#
# Required secrets:
#   CHOCOLATEY_API_KEY   Same org-level secret the launcher's
#                        publish-chocolatey.yml uses.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Recorder semver that was released to GitHub'
        required: true
        default: '0.1.0'
      dry_run:
        description: 'Build the .nupkg but skip the push'
        required: false
        type: boolean
        default: false

# Least privilege. The only GITHUB_TOKEN use in this workflow is the
# release-assets preflight gate below, which only reads releases; the
# push to the tap/bucket repo uses a deploy key, not this token.
permissions:
  contents: read

jobs:
  build-and-publish:
    # Runs on the org's persistent reprobuild-managed Windows runners
    # (win-ci-bare-001 / win-ci-vm-001). `dev-env-ready` means the host can
    # enter a reprobuild dev env; `choco` itself comes from THIS repo's
    # repro.nim `uses:` block, not from the runner.
    runs-on: [self-hosted, Windows, X64, dev-env-ready]
    name: build + push codetracer-solana-recorder.<version>.nupkg
    environment: chocolatey
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The `inputs` context is populated only for workflow_dispatch. On a
          # `push: tags` run it is empty, so take the version from the tag
          # instead, and fail loudly rather than publishing an empty version.
          $prefix = 'refs/tags/v'
          if ($Env:GITHUB_REF -and $Env:GITHUB_REF.StartsWith($prefix)) {
            $version = $Env:GITHUB_REF.Substring($prefix.Length)
          } else {
            $version = $Env:INPUT_VERSION
          }
          if ([string]::IsNullOrEmpty($version)) {
            Write-Output "::error::Cannot resolve a version: this run is neither a refs/tags/v* push nor a workflow_dispatch supplying inputs.version."
            exit 1
          }
          Write-Output "Resolved version: $version"
          "version=$version" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding ascii

      # --- release-assets preflight gate -----------------------------
      # Every step after this one fetches
      #   https://github.com/<repo>/releases/download/v<version>/<asset>
      # which resolves only when a PUBLISHED (non-draft) GitHub release
      # for this tag already carries those exact asset names. On a
      # `push: tags` run nothing guarantees that: this workflow CONSUMES
      # release assets, it does not produce them, and it is not ordered
      # after anything that does.
      #
      # Measured: without this step a missing asset surfaces as exactly
      # 50 bytes -- `curl: (22) The requested URL returned error: 404`
      # -- from the hash loop below. Quick, but it names neither the
      # repo, the tag, the asset, nor which cause applies. This step
      # costs one API call and names all four, telling the three causes
      # apart because each needs a different fix:
      #   * no release exists for the tag  -> cut one / add a producer
      #   * a release exists but is a DRAFT -> publish it; draft assets
      #     are NOT served at releases/download/ (both release workflows
      #     in this fleet -- codetracer-native-recorder's release.yml and
      #     codetracer-wasm-recorder's release.yaml -- cut drafts today)
      #   * the release is published but lacks a name we fetch
      #
      # Deliberately one check, not a poll. For 47 of these 48 channels
      # the asset is not late, it is never built (see the fleet audit in
      # the commit message), so a wait-for-assets loop would convert a
      # 1-second named red into a timeout-length anonymous one.
      # `{v}` in REQUIRED_ASSETS is replaced with the version resolved
      # above.
      # ---------------------------------------------------------------
      - name: Require a published release carrying the expected assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: metacraft-labs/codetracer-solana-recorder
          CHANNEL: publish-chocolatey
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRED_ASSETS: |
            codetracer-solana-recorder-{v}-windows-x86_64.zip
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$Env:VERSION"
          $api = "https://api.github.com/repos/$Env:RELEASE_REPO"
          $headers = @{
              'Accept'               = 'application/vnd.github+json'
              'Authorization'        = "Bearer $Env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
          }

          # Resolve the asset-name templates ({v} -> the version) up front, so every
          # message below names the real file names this run needs.
          $wanted = @()
          foreach ($tpl in ($Env:REQUIRED_ASSETS -split "`n")) {
              $t = $tpl.Trim()
              if (-not $t) { continue }
              $wanted += $t.Replace('{v}', $Env:VERSION)
          }

          $rel = $null
          try {
              $rel = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
              $status = 0
              if ($_.Exception.Response) {
                  $status = [int]$_.Exception.Response.StatusCode
              }
              if ($status -eq 404) {
                  # GET /releases/tags/<tag> never matches a DRAFT: a draft carries no
                  # tag association until it is published. List releases to tell the
                  # two cases apart, because they need different fixes.
                  $isDraft = $false
                  try {
                      $all = Invoke-RestMethod -Uri "$api/releases?per_page=100" -Headers $headers
                      $isDraft = [bool]($all | Where-Object { $_.tag_name -eq $tag })
                  } catch { $isDraft = $false }
                  if ($isDraft) {
                      Write-Output "::error title=${Env:CHANNEL}: release $tag is a DRAFT::$Env:RELEASE_REPO has a release for $tag, but it is a DRAFT. A draft's assets are NOT served at /releases/download/$tag/ , so every fetch below would 404. Publish (un-draft) the release, then re-run this workflow via workflow_dispatch with version=$Env:VERSION. Needs: $($wanted -join ' ')"
                  } else {
                      Write-Output "::error title=${Env:CHANNEL}: no release for $tag::$Env:RELEASE_REPO has no GitHub release for $tag, so /releases/download/$tag/ serves nothing. This workflow CONSUMES release assets; it does not produce them. Cut the release first, then re-run via workflow_dispatch with version=$Env:VERSION. Needs: $($wanted -join ' ')"
                  }
              } else {
                  Write-Output "::error title=${Env:CHANNEL}: cannot query releases::GET $api/releases/tags/$tag failed with HTTP $status. Refusing to fetch assets blind."
              }
              exit 1
          }

          $present = @($rel.assets | ForEach-Object { $_.name })
          $missing = @($wanted | Where-Object { $present -notcontains $_ })
          if ($missing.Count -gt 0) {
              Write-Output "::error title=${Env:CHANNEL}: release $tag is missing assets::Release $tag is published but does not carry: $($missing -join ' '). It carries: $($present -join ' '). The next step fetches each missing name by URL and would 404."
              exit 1
          }
          Write-Output "Release $tag is published and carries every required asset: $($wanted -join ' ')"

      - name: Fetch sha256 for the windows-x86_64 zip
        id: hash
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $url = "https://github.com/metacraft-labs/codetracer-solana-recorder/releases/download/v$Env:VERSION/codetracer-solana-recorder-$Env:VERSION-windows-x86_64.zip"
          $tmp = New-TemporaryFile
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $sha = (Get-FileHash -Path $tmp -Algorithm SHA256).Hash.ToLower()
          "windows-x86_64=$sha" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Rewrite NuSpec + install script
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_WINDOWS_X86_64: ${{ steps.hash.outputs.windows-x86_64 }}
        run: |
          $nuspec = 'packaging/chocolatey/codetracer-solana-recorder.nuspec'
          (Get-Content $nuspec) `
            -replace '<version>[^<]*</version>', "<version>$Env:VERSION</version>" `
            -replace 'releases/tag/v[0-9.]+', "releases/tag/v$Env:VERSION" |
            Set-Content $nuspec
          $install = 'packaging/chocolatey/tools/chocolateyInstall.ps1'
          (Get-Content $install) `
            -replace 'releases/download/v[0-9.]+', "releases/download/v$Env:VERSION" `
            -replace 'codetracer-solana-recorder-[0-9.]+-windows-x86_64.zip', "codetracer-solana-recorder-$Env:VERSION-windows-x86_64.zip" `
            -replace 'REPLACE_AT_PUBLISH_TIME_windows_x86_64', $Env:SHA_WINDOWS_X86_64 |
            Set-Content $install
          Write-Host '--- rewritten nuspec ---'
          Get-Content $nuspec
          Write-Host '--- rewritten install ---'
          Get-Content $install

      - name: choco pack
        shell: pwsh
        run: |
          cd packaging/chocolatey
          choco pack codetracer-solana-recorder.nuspec --out ../../

      - name: choco push
        if: ${{ ! inputs.dry_run }}
        shell: pwsh
        env:
          API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not $Env:API_KEY) {
            Write-Warning 'CHOCOLATEY_API_KEY not set; skipping push.'
            exit 0
          }
          choco push "codetracer-solana-recorder.$Env:VERSION.nupkg" `
            --source https://push.chocolatey.org/ `
            --api-key $Env:API_KEY

      - name: Upload .nupkg artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codetracer-solana-recorder-nupkg
          path: codetracer-solana-recorder.*.nupkg
          if-no-files-found: error
