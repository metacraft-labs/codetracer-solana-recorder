name: CI

# Re-plays the project's deterministic dev env on the runner via the shared
# reusable recorder-CI workflow (nixos-modules). Recorder-specific prep lives in
# the `prepare-ci` just recipe; the shared workflow runs it after setup-dev-env
# and before lint/test, then uploads logs to GitHub (short retention) and
# mirrors them to the in-house S3 artifact store. Runs on the CIP-3 eph-3-class
# runner matrix (the reusable workflow's default).
# See:
#   https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-workflow-standards.md

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-recorder-ci.yml@dev
    with:
      prepare-recipe: prepare-ci
    secrets: inherit
