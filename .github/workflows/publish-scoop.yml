name: publish-scoop

# Refreshes the codetracer-solana-recorder Scoop manifest with a
# fresh sha256 pulled from the recorder's GitHub release and pushes
# a branch to the metacraft-labs/scoop-codetracer bucket repo
# (a human merges the resulting PR).
#
# This is the M11 per-recorder analogue of the launcher's
# publish-scoop.yml. Both emit manifests into the same bucket repo.
#
# Required secrets:
#   SCOOP_BUCKET_DEPLOY_KEY   SSH deploy key (write) on
#                             metacraft-labs/scoop-codetracer
#                             (shared org bucket; same key the
#                             launcher's workflow uses).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Recorder semver that was released to GitHub'
        required: true
        default: '0.1.0'

# Least privilege. The only GITHUB_TOKEN use in this workflow is the
# release-assets preflight gate below, which only reads releases; the
# push to the tap/bucket repo uses a deploy key, not this token.
permissions:
  contents: read

jobs:
  refresh-manifest:
    runs-on: [self-hosted, nixos]
    name: refresh codetracer-solana-recorder.json
    environment: scoop
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The `inputs` context is populated only for workflow_dispatch. On a
          # `push: tags` run it is empty, so take the version from the tag
          # instead, and fail loudly rather than publishing an empty version.
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${INPUT_VERSION}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::Cannot resolve a version: this run is neither a refs/tags/v* push nor a workflow_dispatch supplying inputs.version." >&2
            exit 1
          fi
          echo "Resolved version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # --- release-assets preflight gate -----------------------------
      # Every step after this one fetches
      #   https://github.com/<repo>/releases/download/v<version>/<asset>
      # which resolves only when a PUBLISHED (non-draft) GitHub release
      # for this tag already carries those exact asset names. On a
      # `push: tags` run nothing guarantees that: this workflow CONSUMES
      # release assets, it does not produce them, and it is not ordered
      # after anything that does.
      #
      # Measured: without this step a missing asset surfaces as exactly
      # 50 bytes -- `curl: (22) The requested URL returned error: 404`
      # -- from the hash loop below. Quick, but it names neither the
      # repo, the tag, the asset, nor which cause applies. This step
      # costs one API call and names all four, telling the three causes
      # apart because each needs a different fix:
      #   * no release exists for the tag  -> cut one / add a producer
      #   * a release exists but is a DRAFT -> publish it; draft assets
      #     are NOT served at releases/download/ (both release workflows
      #     in this fleet -- codetracer-native-recorder's release.yml and
      #     codetracer-wasm-recorder's release.yaml -- cut drafts today)
      #   * the release is published but lacks a name we fetch
      #
      # Deliberately one check, not a poll. For 47 of these 48 channels
      # the asset is not late, it is never built (see the fleet audit in
      # the commit message), so a wait-for-assets loop would convert a
      # 1-second named red into a timeout-length anonymous one.
      # `{v}` in REQUIRED_ASSETS is replaced with the version resolved
      # above.
      # ---------------------------------------------------------------
      - name: Require a published release carrying the expected assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: metacraft-labs/codetracer-solana-recorder
          CHANNEL: publish-scoop
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRED_ASSETS: |
            codetracer-solana-recorder-{v}-windows-x86_64.zip
        run: |
          set -uo pipefail
          tag="v${VERSION}"
          api="https://api.github.com/repos/${RELEASE_REPO}"
          accept="Accept: application/vnd.github+json"
          auth="Authorization: Bearer ${GH_TOKEN}"

          # Resolve the asset-name templates ({v} -> the version) up front, so every
          # message below names the real file names this run needs.
          wanted=""
          while IFS= read -r tpl; do
            [ -n "${tpl}" ] || continue
            wanted="${wanted}${tpl//\{v\}/${VERSION}}"$'\n'
          done <<< "${REQUIRED_ASSETS}"
          wanted_1line="$(printf '%s' "${wanted}" | tr '\n' ' ')"

          body="$(mktemp)"
          code="$(curl -sS -o "${body}" -w '%{http_code}' -H "${accept}" -H "${auth}" "${api}/releases/tags/${tag}")" || code="000"

          if [ "${code}" = "404" ]; then
            # GET /releases/tags/<tag> never matches a DRAFT: a draft carries no tag
            # association until it is published. List releases to tell the two cases
            # apart, because they need different fixes.
            list="$(mktemp)"
            curl -sS -o "${list}" -H "${accept}" -H "${auth}" "${api}/releases?per_page=100" || true
            if grep -q "\"tag_name\": *\"${tag}\"" "${list}"; then
              echo "::error title=${CHANNEL}: release ${tag} is a DRAFT::${RELEASE_REPO} has a release for ${tag}, but it is a DRAFT. A draft's assets are NOT served at /releases/download/${tag}/ , so every fetch below would 404. Publish (un-draft) the release, then re-run this workflow via workflow_dispatch with version=${VERSION}. Needs: ${wanted_1line}"
            else
              echo "::error title=${CHANNEL}: no release for ${tag}::${RELEASE_REPO} has no GitHub release for ${tag}, so /releases/download/${tag}/ serves nothing. This workflow CONSUMES release assets; it does not produce them. Cut the release first, then re-run via workflow_dispatch with version=${VERSION}. Needs: ${wanted_1line}"
            fi
            exit 1
          fi

          if [ "${code}" != "200" ]; then
            echo "::error title=${CHANNEL}: cannot query releases::GET ${api}/releases/tags/${tag} returned HTTP ${code}. Refusing to fetch assets blind."
            exit 1
          fi

          # Exactly one "browser_download_url" per attached asset, and that key appears
          # nowhere else in a release object -- so no JSON parser is needed on the runner.
          present="$(sed -n 's/.*"browser_download_url": *"\([^"]*\)".*/\1/p' "${body}" | sed 's|.*/||')"
          missing=""
          while IFS= read -r want; do
            [ -n "${want}" ] || continue
            printf '%s\n' "${present}" | grep -qxF -- "${want}" || missing="${missing} ${want}"
          done <<< "${wanted}"

          if [ -n "${missing}" ]; then
            echo "::error title=${CHANNEL}: release ${tag} is missing assets::Release ${tag} is published but does not carry:${missing} . It carries: $(printf '%s' "${present}" | tr '\n' ' '). The next step fetches each missing name by URL and would 404."
            exit 1
          fi
          echo "Release ${tag} is published and carries every required asset: ${wanted_1line}"

      - name: Fetch sha256 for the windows-x86_64 zip
        id: hash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/metacraft-labs/codetracer-solana-recorder/releases/download/v${VERSION}/codetracer-solana-recorder-${VERSION}-windows-x86_64.zip"
          sha=$(curl -fsSL "$url" | sha256sum | awk '{print $1}')
          echo "windows-x86_64=$sha" >> "$GITHUB_OUTPUT"

      - name: Rewrite manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_WINDOWS_X86_64: ${{ steps.hash.outputs.windows-x86_64 }}
        run: |
          set -euo pipefail
          f=packaging/scoop/codetracer-solana-recorder.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" "$f"
          sed -i "s|releases/download/v[0-9.]*|releases/download/v${VERSION}|g" "$f"
          sed -i "s|codetracer-solana-recorder-[0-9.]*-windows-x86_64.zip|codetracer-solana-recorder-${VERSION}-windows-x86_64.zip|g" "$f"
          sed -i "s/REPLACE_AT_PUBLISH_TIME_windows_x86_64/${SHA_WINDOWS_X86_64}/" "$f"
          echo "--- regenerated $f ---"
          cat "$f"

      - name: Push branch to scoop bucket repo
        env:
          DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::warning::SCOOP_BUCKET_DEPLOY_KEY not set; emitting manifest as artifact instead."
            mkdir -p /tmp/manifest
            cp packaging/scoop/codetracer-solana-recorder.json /tmp/manifest/
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:metacraft-labs/scoop-codetracer.git /tmp/bucket
          mkdir -p /tmp/bucket/bucket
          cp packaging/scoop/codetracer-solana-recorder.json \
            /tmp/bucket/bucket/codetracer-solana-recorder.json
          cd /tmp/bucket
          branch="bump/codetracer-solana-recorder-${VERSION}"
          git checkout -B "$branch"
          git add bucket/codetracer-solana-recorder.json
          git -c user.email=ci@metacraft-labs.com -c user.name='M11 CI' \
            commit -m "codetracer-solana-recorder: ${VERSION}"
          git push -u origin "$branch"
          echo "Pushed $branch — open PR at https://github.com/metacraft-labs/scoop-codetracer/pulls"

      - name: Upload manifest artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codetracer-solana-recorder.json
          path: packaging/scoop/codetracer-solana-recorder.json
          if-no-files-found: error
