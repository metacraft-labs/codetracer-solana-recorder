[package]
name = "codetracer-solana-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Solana programs (Rust/SBF)"
license = "Apache-2.0"

# Allow stylistic clippy 1.96 lints that don't apply meaningfully to
# the SBF/DWARF recorder's hot paths.  The literal `if`/`else` blocks
# and explicit indexing loops mirror the SBPF instruction-decoder
# structure; rewriting them as clippy suggests would obscure the
# semantic shape.  Doc-list indentation is intentional for the
# inline trace-format prose.
[lints.clippy]
collapsible_if = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
if_same_then_else = "allow"
manual_abs_diff = "allow"
manual_is_multiple_of = "allow"
needless_borrow = "allow"
needless_range_loop = "allow"
# SBPF/x86 helpers and test fixture constructors take a whole register
# file (12+ args) as positional parameters because that's the natural
# shape — wrapping them in a struct for the lint's benefit would obscure
# the semantic mapping.
too_many_arguments = "allow"
# CPI execution tests return a partitioned set of PC ranges + per-range
# location lists as a 5-tuple; factoring into a named struct would just
# add noise around a one-shot test fixture.
type_complexity = "allow"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# DWARF parsing for source mapping
addr2line = "0.24"
gimli = "0.31"
object = "0.36"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# HTTP client for Solana RPC
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Base64 decoding for RPC account data
base64 = "0.22"

# SBF virtual machine for program execution with register tracing
solana-sbpf = "0.19"

[dev-dependencies]
tempfile = "3"
